<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223a">
<title>OMNI-Inventario Pro</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecf1; --surface:#fff; --surface2:#f3f5f8; --line:#d0d7e1; --text:#10223a; --muted:#5a6b82;
  --edge:#10223a; --head:#10223a; --head-ink:#fff;
  --accent:#ffc933; --accent-ink:#10223a;
  --ok:#0b7a53; --ok-soft:#d7f3e6; --warn:#9a5b00; --warn-soft:#ffeccb; --bad:#c2243a; --bad-soft:#fbe0e4;
  --r:10px;
}
:root[data-theme=dark]{
  --bg:#08121f; --surface:#0f1e32; --surface2:#142840; --line:#243a54; --text:#e8eef7; --muted:#8fa1b9;
  --edge:#3a5575; --head:#050d18; --head-ink:#e8eef7;
  --ok:#3ddba0; --ok-soft:#0e3a2c; --warn:#ffc15a; --warn-soft:#3a2c0d; --bad:#ff7088; --bad-soft:#401622;
}
*{box-sizing:border-box;margin:0}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.45;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
h1,h2,.sv{font-family:'Archivo',sans-serif;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
.mono{font-family:'IBM Plex Mono',monospace}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:var(--r);background:var(--head);color:var(--accent);display:grid;place-items:center;border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--accent)}
.logo .i{width:26px;height:26px}
h1{font-size:28px;font-weight:800;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:8px;font-weight:600;font-size:14px;border:1.5px solid var(--edge);background:var(--surface);box-shadow:3px 3px 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.icon{padding:10px 11px}
.btn.danger{color:var(--bad)}
.btn.flat{box-shadow:none}.btn.flat:active{transform:none}

/* stats: una sola franja */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r);box-shadow:4px 4px 0 var(--edge);margin-bottom:18px;overflow:hidden}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center;border-right:1.5px solid var(--line)}
.stat:last-child{border-right:0}
.stat .ico{width:42px;height:42px;border-radius:8px;background:var(--surface2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.stat .ico .i{width:21px;height:21px}
.stat span{font-size:13px;color:var(--muted);display:block}
.stat b{font-family:'Archivo',sans-serif;font-size:25px;font-weight:800;white-space:nowrap;line-height:1.15}
.stat.hl{background:var(--accent);color:var(--accent-ink)}
.stat.hl .ico{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.stat.hl span{color:rgba(16,34,58,.75)}

/* scan bar */
.scanbar{background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r);padding:14px;box-shadow:4px 4px 0 var(--edge);display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.scanin{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:0 14px;transition:.15s;color:var(--muted)}
.scanin:focus-within{border-color:var(--edge);box-shadow:3px 3px 0 var(--accent);color:var(--text)}
.scanin .i{width:22px;height:22px}
.scanin input{flex:1;border:0;background:none;padding:14px 0;font-size:17px;outline:none;min-width:0;color:var(--text)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.switch input{appearance:none;width:44px;height:24px;border-radius:6px;background:var(--line);border:1.5px solid var(--edge);position:relative;transition:.2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:3px;background:var(--edge);transition:.2s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(20px);background:#10223a}

/* camera */
#cam{display:none;margin-bottom:18px;background:#000;border:1.5px solid var(--edge);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:4px 4px 0 var(--edge)}
#cam.on{display:block}
#reader{width:100%;min-height:240px}
#reader video{width:100%!important;object-fit:cover}
.cam-top{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:8px}
.cam-top .btn{background:rgba(0,0,0,.65);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none}
.cam-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 4px #000;z-index:5}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:0 12px;color:var(--muted)}
.search:focus-within{border-color:var(--edge);color:var(--text)}
.search input{border:0;background:none;outline:none;padding:11px 0;width:100%;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--edge)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--edge)}
select.sel{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}

/* table */
.card{background:var(--surface);border:1.5px solid var(--edge);border-radius:var(--r);box-shadow:4px 4px 0 var(--edge);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--head-ink);padding:13px 16px;background:var(--head)}
td{padding:13px 16px;border-bottom:1px dashed var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tbody tr.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--accent)}100%{background:transparent}}
.pname{font-weight:600}
.pcode{font-size:12px;color:var(--muted)}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.stock{display:inline-flex;align-items:center;border:1.5px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--surface)}
.stock button{width:30px;height:30px;display:grid;place-items:center;color:var(--text)}
.stock button:hover{background:var(--accent);color:var(--accent-ink)}
.stock span{min-width:36px;text-align:center;font-weight:600;border-inline:1.5px solid var(--line);line-height:30px}
.stock.low span{background:var(--warn-soft);color:var(--warn)}
.stock.zero span{background:var(--bad-soft);color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-Activo{background:var(--ok-soft);color:var(--ok)}
.b-Agotado{background:var(--bad-soft);color:var(--bad)}
.b-Inactivo{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.rowact button:hover{background:var(--surface2);color:var(--text)}
.rowact button[data-act=del]:hover{background:var(--bad-soft);color:var(--bad)}
.margin{font-size:12px;color:var(--ok);font-weight:600}
.margin.neg{color:var(--bad)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{width:64px;height:64px;margin:0 auto 14px;border-radius:12px;border:1.5px dashed var(--edge);display:grid;place-items:center;color:var(--text)}
.empty .big .i{width:30px;height:30px}
.empty h2{color:var(--text);font-size:21px;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:8px}

/* dialogs */
dialog{border:1.5px solid var(--edge);border-radius:14px;padding:0;width:min(460px,calc(100vw - 24px));background:var(--surface);color:var(--text);box-shadow:6px 6px 0 var(--accent);margin:auto}
dialog::backdrop{background:rgba(8,18,31,.6)}
dialog[open]{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.dlg{padding:24px}
.dlg h2{font-size:23px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.dlg h2 .i{padding:7px;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);outline:none;transition:.12s}
.field input:focus,.field select:focus{border-color:var(--edge);box-shadow:3px 3px 0 var(--accent)}
.field input[readonly]{opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profit{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-weight:600;margin-bottom:14px;border:1.5px solid currentColor}
.profit.neg{background:var(--bad-soft);color:var(--bad)}
.dlg .row{display:flex;gap:12px;margin-top:22px}
.dlg .row .btn{flex:1;justify-content:center;padding:12px}

/* toasts */
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(420px,calc(100vw - 24px))}
.toast{background:var(--head);color:var(--head-ink);padding:12px 14px;border-radius:8px;font-weight:500;font-size:14px;border:1.5px solid var(--edge);box-shadow:3px 3px 0 var(--accent);animation:pop .2s ease;display:flex;gap:10px;align-items:center}
.toast .i{color:var(--accent)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}

/* responsive */
@media(max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1.5px solid var(--line)}
}
@media(max-width:640px){
  .hide-sm{display:none}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px;border-bottom:1px dashed var(--line)}
  td{padding:0;border:0}
  td.c-name{grid-column:1}td.c-sell{grid-column:2;grid-row:1;text-align:right}
  td.c-stock{grid-column:1}td.c-status{grid-column:2;grid-row:2;text-align:right}
  td.c-act{grid-column:1/-1}
  .stat{padding:12px}.stat .ico{display:none}.stat b{font-size:21px}
  .btn .lbl{display:none}.actions .btn.primary .lbl{display:inline}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i"><use href="#i-package"/></svg></div>
      <div><h1>OMNI-Inventario</h1><small>Escanea, registra y exporta</small></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-cam"></button>
      <button class="btn" id="btn-export"><svg class="i"><use href="#i-sheet"/></svg><span class="lbl">Exportar Excel</span></button>
      <button class="btn" id="btn-import"><svg class="i"><use href="#i-upload"/></svg><span class="lbl">Importar</span></button>
      <button class="btn icon" id="btn-theme" aria-label="Cambiar tema"></button>
      <input type="file" id="file-import" accept=".xlsx,.xls,.csv" hidden>
    </div>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="stat hl"><div class="ico"><svg class="i"><use href="#i-package"/></svg></div><div><span>Productos</span><b id="s-count">0</b></div></div>
    <div class="stat"><div class="ico"><svg class="i"><use href="#i-layers"/></svg></div><div><span>Unidades en stock</span><b id="s-units">0</b></div></div>
    <div class="stat"><div class="ico"><svg class="i"><use href="#i-cash"/></svg></div><div><span>Valor al costo</span><b id="s-cost">$0</b></div></div>
    <div class="stat"><div class="ico"><svg class="i"><use href="#i-trend"/></svg></div><div><span>Ganancia potencial</span><b id="s-profit">$0</b></div></div>
  </section>

  <section class="scanbar">
    <label class="scanin">
      <svg class="i"><use href="#i-barcode"/></svg>
      <input type="text" id="manual-barcode" placeholder="Escanea o escribe un código y pulsa Enter" autocomplete="off" autofocus>
    </label>
    <label class="switch" title="Al escanear un producto existente, suma 1 al stock sin abrir el formulario">
      <input type="checkbox" id="quick-mode"> Modo rápido (+1 al escanear)
    </label>
  </section>

  <section id="cam" aria-label="Cámara">
    <div class="cam-top">
      <button class="btn" id="btn-torch" hidden><svg class="i"><use href="#i-zap"/></svg>Linterna</button>
      <button class="btn" id="btn-cam-close"><svg class="i"><use href="#i-x"/></svg>Cerrar</button>
    </div>
    <div id="reader"></div>
    <div class="cam-hint">Apunta al código de barras o QR</div>
  </section>

  <div class="toolbar">
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input type="search" id="search" placeholder="Buscar por nombre o código" aria-label="Buscar"></div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="Activo" aria-pressed="false">Activos</button>
      <button class="chip" data-f="low" aria-pressed="false">Stock bajo</button>
      <button class="chip" data-f="Agotado" aria-pressed="false">Agotados</button>
      <button class="chip" data-f="Inactivo" aria-pressed="false">Inactivos</button>
    </div>
    <select class="sel" id="sort" aria-label="Ordenar">
      <option value="recent">Más recientes</option>
      <option value="name">Nombre A–Z</option>
      <option value="stock-asc">Menor stock</option>
      <option value="stock-desc">Mayor stock</option>
      <option value="profit">Mayor ganancia</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th>Producto</th><th>Stock</th><th class="num hide-sm">Compra</th><th class="num">Venta</th><th>Estado</th><th></th>
      </tr></thead>
      <tbody id="product-body"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>

  <div class="foot">
    <span id="total-count"></span>
    <button class="btn danger flat" id="btn-clear"><svg class="i"><use href="#i-trash"/></svg>Vaciar inventario</button>
  </div>
</div>

<!-- Modal producto -->
<dialog id="product-modal">
  <div class="dlg">
    <h2><svg class="i"><use href="#i-package"/></svg><span id="modal-title">Nuevo producto</span></h2>
    <div class="field"><label for="form-barcode">Código</label><input type="text" id="form-barcode" class="mono" readonly></div>
    <div class="field"><label for="form-name">Nombre</label><input type="text" id="form-name" placeholder="Ej. Cargador USB-C 20W" autocomplete="off"></div>
    <div class="grid2">
      <div class="field"><label for="form-price-buy">Precio de compra</label><input type="number" id="form-price-buy" min="0" step="0.01" inputmode="decimal"></div>
      <div class="field"><label for="form-price-sell">Precio de venta</label><input type="number" id="form-price-sell" min="0" step="0.01" inputmode="decimal"></div>
    </div>
    <div class="profit" id="profit-display"><span>Ganancia</span><span>$0.00</span></div>
    <div class="grid2">
      <div class="field"><label for="form-stock">Stock</label><input type="number" id="form-stock" min="0" step="1" inputmode="numeric"></div>
      <div class="field"><label for="form-status">Estado</label>
        <select id="form-status"><option>Activo</option><option>Inactivo</option><option>Agotado</option></select>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="btn-cancel">Cancelar</button>
      <button class="btn primary" id="btn-save"><svg class="i"><use href="#i-check"/></svg>Guardar</button>
    </div>
  </div>
</dialog>

<!-- Confirmación -->
<dialog id="confirm-modal">
  <div class="dlg">
    <h2><svg class="i"><use href="#i-alert"/></svg><span id="confirm-title">¿Seguro?</span></h2>
    <p id="confirm-text" style="color:var(--muted)"></p>
    <div class="row">
      <button class="btn" id="confirm-no">Cancelar</button>
      <button class="btn" id="confirm-yes" style="background:var(--bad);color:#fff">Eliminar</button>
    </div>
  </div>
</dialog>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
const KEY = 'omni-inventory', THEME_KEY = 'omni-theme', LOW = 5;
const $ = id => document.getElementById(id);
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let products = [];
try { products = JSON.parse(localStorage.getItem(KEY)) || []; if (!Array.isArray(products)) products = []; } catch { products = []; }
const state = { filter: 'all', q: '', sort: 'recent', scanner: null, lastScan: '', lastScanAt: 0, flash: null };

const persist = () => localStorage.setItem(KEY, JSON.stringify(products));

/* ---------- Tema ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('btn-theme').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
}
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('btn-theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, t); applyTheme(t);
};

/* ---------- Toasts y sonido ---------- */
function toast(msg, icon = 'check') {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `${ic(icon)}<span>${esc(msg)}</span>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
}
let actx;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = 1040; g.gain.value = .05;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .1);
  } catch {}
  navigator.vibrate?.(60);
}
function confirmDialog(title, text, yes = 'Eliminar') {
  return new Promise(res => {
    $('confirm-title').textContent = title; $('confirm-text').textContent = text; $('confirm-yes').textContent = yes;
    const d = $('confirm-modal'); d.showModal();
    const done = v => { d.close(); res(v); };
    $('confirm-yes').onclick = () => done(true); $('confirm-no').onclick = () => done(false);
    d.oncancel = () => res(false);
  });
}

/* ---------- Lógica ---------- */
const statusOf = (stock, current) => stock <= 0 ? 'Agotado' : (current === 'Agotado' ? 'Activo' : current);
const profitOf = p => (p.priceSell || 0) - (p.priceBuy || 0);

function handleCode(raw) {
  const code = String(raw).trim();
  if (!code) return;
  const p = products.find(x => x.barcode === code);
  if (p && $('quick-mode').checked) {
    p.stock = (p.stock || 0) + 1; p.status = statusOf(p.stock, p.status); p.date = new Date().toISOString();
    persist(); state.flash = code; render(); toast(`${p.name}: stock ${p.stock}`, 'plus');
    return;
  }
  openModal(p || { barcode: code, name: '', priceBuy: '', priceSell: '', stock: 1, status: 'Activo' }, !p);
}

$('manual-barcode').addEventListener('keydown', e => {
  if (e.key === 'Enter') { handleCode(e.target.value); e.target.value = ''; }
});
// Lector USB: si se teclea fuera de un campo, redirige al campo de código
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  if (document.querySelector('dialog[open]') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  $('manual-barcode').focus();
});

/* ---------- Modal ---------- */
let isNew = true;
function openModal(p, nuevo) {
  isNew = nuevo;
  $('modal-title').textContent = nuevo ? 'Nuevo producto' : 'Editar producto';
  $('form-barcode').value = p.barcode;
  $('form-name').value = p.name || '';
  $('form-price-buy').value = p.priceBuy ?? '';
  $('form-price-sell').value = p.priceSell ?? '';
  $('form-stock').value = p.stock ?? 1;
  $('form-status').value = p.status || 'Activo';
  calcProfit();
  $('product-modal').showModal();
  setTimeout(() => $('form-name').focus(), 50);
}
function closeModal() { $('product-modal').close(); $('manual-barcode').focus(); }
function calcProfit() {
  const buy = parseFloat($('form-price-buy').value) || 0, sell = parseFloat($('form-price-sell').value) || 0;
  const diff = sell - buy, pct = buy > 0 ? ' · ' + ((diff / buy) * 100).toFixed(0) + '%' : '';
  const d = $('profit-display');
  d.className = 'profit' + (diff < 0 ? ' neg' : '');
  d.innerHTML = `<span>Ganancia por unidad</span><span>${money(diff)}${pct}</span>`;
}
['form-price-buy', 'form-price-sell'].forEach(id => $(id).addEventListener('input', calcProfit));
$('form-stock').addEventListener('input', () => {
  const s = parseInt($('form-stock').value);
  if (s === 0) $('form-status').value = 'Agotado';
  else if ($('form-status').value === 'Agotado') $('form-status').value = 'Activo';
});

function saveProduct() {
  const barcode = $('form-barcode').value;
  const name = $('form-name').value.trim();
  if (!name) { toast('El nombre es obligatorio', 'alert'); $('form-name').focus(); return; }
  const stock = Math.max(0, parseInt($('form-stock').value) || 0);
  const p = {
    barcode, name,
    priceBuy: Math.max(0, parseFloat($('form-price-buy').value) || 0),
    priceSell: Math.max(0, parseFloat($('form-price-sell').value) || 0),
    stock, status: statusOf(stock, $('form-status').value),
    date: new Date().toISOString()
  };
  const i = products.findIndex(x => x.barcode === barcode);
  if (i !== -1) products[i] = p; else products.unshift(p);
  persist(); state.flash = barcode; render(); closeModal();
  toast(isNew ? 'Producto agregado' : 'Cambios guardados');
}
$('btn-save').onclick = saveProduct;
$('btn-cancel').onclick = closeModal;
$('product-modal').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); saveProduct(); } });
$('product-modal').addEventListener('close', () => $('manual-barcode').focus());

/* ---------- Render ---------- */
function visible() {
  const q = state.q.toLowerCase();
  let list = products.filter(p => {
    if (q && !(p.name.toLowerCase().includes(q) || p.barcode.toLowerCase().includes(q))) return false;
    if (state.filter === 'all') return true;
    if (state.filter === 'low') return p.stock > 0 && p.stock <= LOW;
    return p.status === state.filter;
  });
  const sorts = {
    recent: (a, b) => (b.date || '').localeCompare(a.date || ''),
    name: (a, b) => a.name.localeCompare(b.name, 'es'),
    'stock-asc': (a, b) => a.stock - b.stock,
    'stock-desc': (a, b) => b.stock - a.stock,
    profit: (a, b) => profitOf(b) - profitOf(a)
  };
  return list.sort(sorts[state.sort]);
}

function render() {
  const list = visible();
  $('product-body').innerHTML = list.map(p => {
    const profit = profitOf(p), pct = p.priceBuy > 0 ? Math.round(profit / p.priceBuy * 100) : null;
    const cls = p.stock <= 0 ? 'zero' : p.stock <= LOW ? 'low' : '';
    return `<tr data-code="${esc(p.barcode)}" class="${state.flash === p.barcode ? 'flash' : ''}">
      <td class="c-name"><div class="pname">${esc(p.name)}</div><div class="pcode mono">${esc(p.barcode)}</div></td>
      <td class="c-stock"><div class="stock ${cls}"><button data-act="minus" aria-label="Restar 1">${ic('minus')}</button><span>${p.stock}</span><button data-act="plus" aria-label="Sumar 1">${ic('plus')}</button></div></td>
      <td class="num hide-sm">${money(p.priceBuy)}</td>
      <td class="num c-sell"><b>${money(p.priceSell)}</b>${pct !== null ? `<div class="margin ${profit < 0 ? 'neg' : ''}">${profit >= 0 ? '+' : ''}${pct}%</div>` : ''}</td>
      <td class="c-status"><span class="badge b-${esc(p.status)}">${esc(p.status)}</span></td>
      <td class="c-act"><div class="rowact"><button data-act="edit" aria-label="Editar">${ic('edit')}</button><button data-act="del" aria-label="Eliminar">${ic('trash')}</button></div></td>
    </tr>`;
  }).join('');
  state.flash = null;

  const e = $('empty');
  e.hidden = list.length > 0;
  if (!list.length) {
    e.innerHTML = products.length
      ? `<div class="big">${ic('search')}</div><h2>Sin resultados</h2><p>Prueba con otra búsqueda o cambia el filtro.</p>`
      : `<div class="big">${ic('barcode')}</div><h2>Tu inventario está vacío</h2><p>Escanea un código con la cámara o escríbelo arriba para agregar tu primer producto.</p>`;
  }

  const units = products.reduce((a, p) => a + (p.stock || 0), 0);
  const cost = products.reduce((a, p) => a + (p.stock || 0) * (p.priceBuy || 0), 0);
  const prof = products.reduce((a, p) => a + (p.stock || 0) * profitOf(p), 0);
  $('s-count').textContent = products.length;
  $('s-units').textContent = units.toLocaleString('en-US');
  $('s-cost').textContent = money(cost).replace(/\.00$/, '');
  $('s-profit').textContent = money(prof).replace(/\.00$/, '');
  const low = products.filter(p => p.stock > 0 && p.stock <= LOW).length;
  $('total-count').textContent = `Mostrando ${list.length} de ${products.length}` + (low ? ` · ${low} con stock bajo` : '');
}

$('product-body').addEventListener('click', async e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const p = products.find(x => x.barcode === tr.dataset.code); if (!p) return;
  const act = e.target.closest('button')?.dataset.act;
  if (act === 'plus' || act === 'minus') {
    p.stock = Math.max(0, (p.stock || 0) + (act === 'plus' ? 1 : -1));
    p.status = statusOf(p.stock, p.status); p.date = new Date().toISOString();
    persist(); render();
  } else if (act === 'del') {
    if (await confirmDialog('¿Eliminar producto?', `Se borrará "${p.name}" del inventario.`)) {
      products = products.filter(x => x !== p); persist(); render(); toast('Producto eliminado', 'trash');
    }
  } else if (act === 'edit' || !act) openModal(p, false);
});

$('search').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  state.filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  render();
});

$('btn-clear').onclick = async () => {
  if (!products.length) return toast('No hay nada que borrar', 'info');
  if (await confirmDialog('¿Vaciar inventario?', `Se eliminarán los ${products.length} productos. Exporta a Excel antes si quieres un respaldo.`, 'Vaciar todo')) {
    products = []; localStorage.removeItem(KEY); render(); toast('Inventario vaciado', 'trash');
  }
};

/* ---------- Cámara ---------- */
const setCamBtn = on => { $('btn-cam').innerHTML = `${ic('camera')}<span class="lbl">${on ? 'Cámara activa' : 'Escanear con cámara'}</span>`; };
setCamBtn(false);

async function startScanner() {
  $('cam').classList.add('on');
  try {
    state.scanner = new Html5Qrcode('reader');
    await state.scanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.min(w * .85, 320), height: Math.min(h * .6, 170) }) },
      text => {
        const now = Date.now();
        if (text === state.lastScan && now - state.lastScanAt < 2500) return; // evita lecturas repetidas
        state.lastScan = text; state.lastScanAt = now;
        beep(); handleCode(text);
        if (!$('quick-mode').checked) stopScanner();
      }
    );
    const caps = state.scanner.getRunningTrackCapabilities?.();
    $('btn-torch').hidden = !(caps && caps.torch);
    setCamBtn(true);
  } catch (err) {
    toast('No se pudo abrir la cámara. Revisa los permisos del navegador.', 'alert');
    stopScanner();
  }
}
async function stopScanner() {
  const s = state.scanner; state.scanner = null;
  $('cam').classList.remove('on'); setCamBtn(false);
  if (s) { try { await s.stop(); s.clear(); } catch {} }
}
let torchOn = false;
$('btn-torch').onclick = async () => {
  torchOn = !torchOn;
  try { await state.scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] }); } catch { toast('Linterna no disponible', 'alert'); }
};
$('btn-cam').onclick = () => state.scanner ? stopScanner() : startScanner();
$('btn-cam-close').onclick = stopScanner;

/* ---------- Excel ---------- */
$('btn-export').onclick = () => {
  if (!products.length) return toast('No hay productos para exportar', 'info');
  const rows = products.map(p => ({
    'Código': p.barcode, 'Producto': p.name, 'Stock': p.stock,
    'Precio compra': p.priceBuy, 'Precio venta': p.priceSell,
    'Ganancia unidad': +profitOf(p).toFixed(2), 'Estado': p.status,
    'Actualizado': p.date ? new Date(p.date).toLocaleString('es') : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 18 }, { wch: 32 }, { wch: 8 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 12 }, { wch: 20 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, `OMNI_Inventario_${new Date().toISOString().slice(0, 10)}.xlsx`);
  toast('Excel descargado', 'sheet');
};
$('btn-import').onclick = () => $('file-import').click();
$('file-import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    let added = 0, updated = 0;
    rows.forEach(r => {
      const barcode = String(r['Código'] ?? r['Codigo'] ?? r.barcode ?? '').trim();
      const name = String(r['Producto'] ?? r.name ?? '').trim();
      if (!barcode || !name) return;
      const stock = Math.max(0, parseInt(r['Stock'] ?? r.stock) || 0);
      const p = {
        barcode, name, stock,
        priceBuy: parseFloat(r['Precio compra'] ?? r.priceBuy) || 0,
        priceSell: parseFloat(r['Precio venta'] ?? r.priceSell) || 0,
        status: statusOf(stock, ['Activo', 'Inactivo', 'Agotado'].includes(r['Estado']) ? r['Estado'] : 'Activo'),
        date: new Date().toISOString()
      };
      const i = products.findIndex(x => x.barcode === barcode);
      if (i !== -1) { products[i] = p; updated++; } else { products.unshift(p); added++; }
    });
    persist(); render(); toast(`Importado: ${added} nuevos, ${updated} actualizados`, 'upload');
  } catch { toast('No se pudo leer el archivo', 'alert'); }
};

render();
</script>
</body>
</html>
