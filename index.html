<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223a">
<title>OMNI-Inventario Pro</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-package" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M16 7v10"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
</svg>
<div class="wrap">
<header>
  <div class="brand"><div class="logo" aria-hidden="true"><svg class="i"><use href="#i-package"/></svg></div><div><h1>OMNI-Inventario</h1><small>Escanea, registra y exporta</small></div></div>
  <div class="actions">
    <button class="btn primary" id="btn-cam"></button>
    <button class="btn" id="btn-export"><svg class="i"><use href="#i-sheet"/></svg><span class="lbl">Exportar Excel</span></button>
    <button class="btn" id="btn-import"><svg class="i"><use href="#i-upload"/></svg><span class="lbl">Importar</span></button>
    <button class="btn icon" id="btn-theme" aria-label="Cambiar tema"></button>
    <input type="file" id="file-import" accept=".xlsx,.xls,.csv" hidden>
  </div>
</header>
<section class="stats" aria-label="Resumen">
  <div class="stat hl"><div class="ico"><svg class="i"><use href="#i-package"/></svg></div><div><span>Productos</span><b id="s-count">0</b></div></div>
  <div class="stat"><div class="ico"><svg class="i"><use href="#i-layers"/></svg></div><div><span>Unidades en stock</span><b id="s-units">0</b></div></div>
  <div class="stat"><div class="ico"><svg class="i"><use href="#i-cash"/></svg></div><div><span>Valor al costo</span><b id="s-cost">$0</b></div></div>
  <div class="stat"><div class="ico"><svg class="i"><use href="#i-trend"/></svg></div><div><span>Ganancia potencial</span><b id="s-profit">$0</b></div></div>
</section>
<section class="scanbar">
  <label class="scanin"><svg class="i"><use href="#i-barcode"/></svg><input type="text" id="manual-barcode" placeholder="Escanea o escribe un código y pulsa Enter" autocomplete="off" autofocus></label>
  <label class="switch" title="Al escanear un producto existente, suma 1 al stock sin abrir el formulario"><input type="checkbox" id="quick-mode"> Modo rápido (+1 al escanear)</label>
</section>
<section id="cam" aria-label="Cámara">
  <div class="cam-top"><button class="btn" id="btn-torch" hidden><svg class="i"><use href="#i-zap"/></svg>Linterna</button><button class="btn" id="btn-cam-close"><svg class="i"><use href="#i-x"/></svg>Cerrar</button></div>
  <div id="reader"></div><div class="cam-hint">Apunta al código de barras o QR</div>
</section>
<div class="toolbar">
  <div class="search"><svg class="i"><use href="#i-search"/></svg><input type="search" id="search" placeholder="Buscar por nombre o código" aria-label="Buscar"></div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por estado">
    <button class="chip" data-f="all" aria-pressed="true">Todos</button><button class="chip" data-f="Activo" aria-pressed="false">Activos</button><button class="chip" data-f="low" aria-pressed="false">Stock bajo</button><button class="chip" data-f="Agotado" aria-pressed="false">Agotados</button><button class="chip" data-f="Inactivo" aria-pressed="false">Inactivos</button>
  </div>
  <select class="sel" id="sort" aria-label="Ordenar"><option value="recent">Más recientes</option><option value="name">Nombre A–Z</option><option value="stock-asc">Menor stock</option><option value="stock-desc">Mayor stock</option><option value="profit">Mayor ganancia</option></select>
</div>
<div class="card">
  <table><thead><tr><th>Producto</th><th>Stock</th><th class="num hide-sm">Compra</th><th class="num">Venta</th><th>Estado</th><th></th></tr></thead><tbody id="product-body"></tbody></table>
  <div id="empty" class="empty" hidden></div>
</div>
<div class="foot"><span id="total-count"></span><button class="btn danger flat" id="btn-clear"><svg class="i"><use href="#i-trash"/></svg>Vaciar inventario</button></div>
</div>
<dialog id="product-modal">
<div class="dlg">
  <h2><svg class="i"><use href="#i-package"/></svg><span id="modal-title">Nuevo producto</span></h2>
  <div class="field"><label for="form-barcode">Código</label><input type="text" id="form-barcode" class="mono" readonly></div>
  <div class="field"><label for="form-name">Nombre</label><input type="text" id="form-name" placeholder="Ej. Cargador USB-C 20W" autocomplete="off"></div>
  <div class="grid2"><div class="field"><label for="form-price-buy">Precio de compra</label><input type="number" id="form-price-buy" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label for="form-price-sell">Precio de venta</label><input type="number" id="form-price-sell" min="0" step="0.01" inputmode="decimal"></div></div>
  <div class="profit" id="profit-display"><span>Ganancia</span><span>$0.00</span></div>
  <div class="grid2"><div class="field"><label for="form-stock">Stock</label><input type="number" id="form-stock" min="0" step="1" inputmode="numeric"></div><div class="field"><label for="form-status">Estado</label><select id="form-status"><option>Activo</option><option>Inactivo</option><option>Agotado</option></select></div></div>
  <div class="row"><button class="btn" id="btn-cancel">Cancelar</button><button class="btn primary" id="btn-save"><svg class="i"><use href="#i-check"/></svg>Guardar</button></div>
</div>
</dialog>
<dialog id="confirm-modal">
<div class="dlg">
  <h2><svg class="i"><use href="#i-alert"/></svg><span id="confirm-title">¿Seguro?</span></h2><p id="confirm-text" style="color:var(--muted)"></p>
  <div class="row"><button class="btn" id="confirm-no">Cancelar</button><button class="btn" id="confirm-yes" style="background:var(--bad);color:#fff">Eliminar</button></div>
</div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
